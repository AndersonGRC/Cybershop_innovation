# Drop-in de cybershop.service (instancia principal).
#
# La principal lee su .cybershop.conf, no el env de Integraciones del maestro.
# Este drop-in le suma SOLO los ajustes de IA que el maestro guarda aparte al
# pulsar "Guardar integraciones" (integrations_service._write_primary_ia_env):
# Asistente IA (AI_BASE_URL, AI_MODEL, AI_API_KEY) y respaldo Anthropic
# (AI_NUBE_*). Pagos, correo y DIAN siguen en su .cybershop.conf.
#
# Las variables de este archivo ganan a las de .cybershop.conf (load_dotenv no
# sobrescribe lo que ya está en el entorno). El "-" permite arrancar sin él.
#
# Instalar una vez (root), ver DEPLOY.md:
#   install -D -m 644 deploy/cybershop-ia-env.conf \
#       /etc/systemd/system/cybershop.service.d/ia-env.conf
#   systemctl daemon-reload && systemctl restart cybershop
[Service]
EnvironmentFile=-/etc/cybershop/cyber-t001.ia.env
